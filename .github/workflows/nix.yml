# Keeps deploy/package.nix's vendorHash honest.
#
# vendorHash pins the output of the go-modules FOD. Every go.mod or go.sum edit
# changes what `go mod download` resolves to, so every dependabot bump
# invalidates it -- and because the FOD is only realised when the package is
# built, the mismatch first shows up in a CONSUMER's rebuild, after the merge.
#
# Two jobs:
#
#   gate decides mergeability. A PR that touches go.mod, go.sum or
#       deploy/package.nix with a wrong vendorHash is red.
#   heal removes the manual step that keeps slipping. On a dependabot PR
#       whose hash is wrong it refreshes the hash and pushes it back onto the
#       PR branch, so the gate goes green on its own.
#
# Both also run on main, so a hand edit cannot sneak through either.

name: nix

# Deliberately unfiltered: the gate must publish a `vendorHash` check on EVERY
# pull request, or a branch rule requiring that check would block all the PRs
# that legitimately do not touch go.mod (a doc fix, a workflow tweak). The check
# is a few seconds, so filtering it for speed buys nothing and costs the ability
# to make it required. `main` keeps its path filter: only the files that can
# actually invalidate the hash are worth a direct-push check there.
on:
  pull_request:
  push:
    branches: [main]
    paths:
      - go.mod
      - go.sum
      - deploy/**
      - Makefile
      - .github/workflows/nix.yml
  workflow_dispatch:

concurrency:
  # One run per ref, but NEVER cancel a run mid-flight: the heal job force-pushes
  # from inside a run, and that push starts the next run on the same ref group.
  # With cancel-in-progress the old run can be killed while heal is still working,
  # and the post-heal run that publishes the vendorHash check the branch rule needs
  # is the one that gets dropped -- leaving the PR with no check and no way to go
  # green. Queueing instead costs at most one queued run per ref.
  group: nix-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  # The nixpkgs revision the consuming NixOS host builds this package with. The
  # go-modules FOD hash is a function of nixpkgs' `go mod download`
  # implementation and the Go toolchain it selects, so the check has to run
  # against the host's revision or it drifts into false alarms as the channel
  # moves. Mirrors NIXPKGS_REV in the Makefile; bump both together, in their own
  # commit, then re-run `make nix-vendor-hash`.
  NIXPKGS_REV: 643809054d65fdd466a63e3155b8c498cb483c04

jobs:
  gate:
    name: vendorHash
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            accept-flake-config = true

      # The go-modules FOD only. The outer derivation's build product has no
      # bearing on the hash, so this costs a module download and a directory
      # copy instead of a Go compile and the test suite: low minutes, no
      # self-hosted runner, and the FOD itself stays a sandboxed fixed-output
      # build.
      - name: Check vendorHash
        run: make nix-vendor-hash-check

  heal:
    # Runs only when the gate FAILED, which is the only state worth healing.
    # `needs: gate` alone would skip this job on failure, so it must be paired
    # with `always()`; the condition then narrows it back to that case. The job
    # deliberately omits `cancelled` (a cancelled gate says nothing about the
    # hash) and is restricted to dependabot, since on a human PR the same push
    # would rewrite a branch under the author, and on main there is no PR to
    # update. A green hash costs nothing here.
    name: refresh-vendorHash
    needs: gate
    if: >-
      ${{
        always() &&
        needs.gate.result == 'failure' &&
        github.event_name == 'pull_request' &&
        github.event.pull_request.user.login == 'dependabot[bot]'
      }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      statuses: write
    steps:
      - uses: actions/checkout@v7
        with:
          # The PR head, so the refresh lands on the branch the gate judges and
          # the automerge workflow then merges.
          ref: ${{ github.event.pull_request.head.ref }}
          repository: ${{ github.event.pull_request.head.repo.full_name }}
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            accept-flake-config = true

      - name: Refresh the vendorHash
        id: refresh
        run: |
          want=$(make --no-print-directory nix-vendor-hash-print) || {
            echo "::error::could not determine the expected vendorHash (see log)"
            exit 1
          }
          have=$(sed -nE 's/.*vendorHash[[:space:]]*=[[:space:]]*"([^"]+)".*/\1/p' deploy/package.nix)
          if [ "$want" = "$have" ]; then
            echo "hash already current: $have"
            exit 0
          fi
          sed -i -E "s|(vendorHash[[:space:]]*=[[:space:]]*\")[^\"]*(\")|\1${want}\2|" deploy/package.nix
          echo "wrote $want in place of $have" >> "$GITHUB_STEP_SUMMARY"
          printf 'changed=true\n' >> "$GITHUB_OUTPUT"

      # Push to the PR branch, never to main. A merge is the only thing that
      # should land there, and it happens once the gate has re-run green.
      #
      # A plain commit rather than an amend. Amending rewrites the PR head, and
      # GitHub then treats the new tip as an unrelated ref: a real post-heal push
      # was recorded with zero associated pull requests and produced no
      # vendorHash check at all, so the PR never went green and the branch rule
      # blocked it indefinitely. A normal commit on top keeps the PR bound to its
      # head, the gate re-runs, and the ruleset sees a result. The extra commit
      # is cosmetic, since the branch dissolves at merge regardless.
      #
      # --force-with-lease rather than --force: the lease is this bot's own fetch
      # from moments ago, so a dependabot or human commit landing on the same
      # branch in the meantime fails the push instead of discarding it.
      - name: Push the refresh
        if: steps.refresh.outputs.changed == 'true'
        env:
          # Head ref via env, not interpolated into the script: actionlint flags
          # inline use as a script-injection vector, and the value only needs to
          # reach git as data.
          BRANCH: ${{ github.event.pull_request.head.ref }}
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B "$BRANCH"
          git add deploy/package.nix
          git commit -m "nix: refresh vendorHash"
          git push --force-with-lease origin "HEAD:$BRANCH"

      # Post-push verification, published as the vendorHash check.
      #
      # Observed on a real runner: the follow-up run for a push authored by
      # github-actions[bot] goes to action_required with zero jobs, so it
      # never publishes a vendorHash check. The PR head then has no check,
      # the branch rule is unsatisfied, and the automerge poll waits on a
      # check that never arrives.
      #
      # So this job publishes the result itself, as a commit status on the sha
      # it just pushed. A status satisfies the same vendorHash context the rule
      # requires, and the rule consults the PR head sha -- exactly this one.
      # Confirmed live: PR #28 carried no vendorHash CheckRun, only this status,
      # and was mergeable.
      - name: Verify the refresh and report it
        id: report
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          sha=$(git rev-parse HEAD)
          url="$GITHUB_SERVER_URL/$REPO/actions/runs/$GITHUB_RUN_ID"
          if make --no-print-directory nix-vendor-hash-check; then
            gh api "repos/$REPO/statuses/$sha" \
              -f state=success \
              -f context=vendorHash \
              -f description='vendorHash refreshed and verified' \
              -f target_url="$url"
          else
            gh api "repos/$REPO/statuses/$sha" \
              -f state=failure \
              -f context=vendorHash \
              -f description='vendorHash still wrong after refresh' \
              -f target_url="$url"
            echo "::error::refresh did not fix the hash"
            exit 1
          fi
