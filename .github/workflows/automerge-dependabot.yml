# Merges dependabot PRs -- but only once the checks have actually run green.
#
# This is the constraint that keeps a bad vendorHash off main. nix.yml decides
# whether a go.mod bump is acceptable; nothing here overrides that, so a red
# gate fails this job and no merge happens.
---
name: "Dependabot Automerge - Action"

on:
  pull_request_target:

permissions:
  contents: write
  pull-requests: write

jobs:
  auto-merge:
    name: DependabotMerge
    runs-on: ubuntu-latest
    if: ${{ github.event.pull_request.user.login == 'dependabot[bot]' }}
    steps:
      # Poll the named check until it resolves. A failure is NOT terminal: a
      # wrong vendorHash is red for exactly one run, until the heal job pushes
      # the corrected hash, and the next poll sees it green. Cancellation and
      # skipping are terminal, and so is the timeout below. Heal pushes with
      # GITHUB_TOKEN, which cannot trigger another run, so this loop is the only
      # thing that re-reads the check after the fix.
      - name: Wait for the vendorHash gate
        env:
          PR_URL: ${{github.event.pull_request.html_url}}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CHECK: vendorHash
        run: |
          for attempt in $(seq 1 60); do
            # gh pr checks folds the gate's check run and any commit status
            # into one list, keyed by the same name, both with a populated
            # bucket. Verified against the live CLI: a heal-published status
            # appears as name=vendorHash bucket=pass, exactly like the gate.
            # Matching on name alone therefore covers both, and `context` is
            # not a field this command accepts. The `state` fallback is kept
            # only as belt-and-braces; the observed shapes always set bucket.
            state=$(gh pr checks "$PR_URL" \
              --json name,bucket,state --jq "
                map(select(.name == \"$CHECK\"))
                | .[0]
                | (.bucket // (if .state == \"SUCCESS\" then \"pass\"
                               elif .state then \"fail\" else \"absent\" end))")
            case "$state" in
              pass)
                echo "check '$CHECK' is green" >> "$GITHUB_STEP_SUMMARY"
                exit 0 ;;
              cancel | skipping)
                echo "::error::required check '$CHECK' is '$state' - refusing to merge"
                exit 1 ;;
            esac
            echo "attempt $attempt on $CHECK: $state" >> "$GITHUB_STEP_SUMMARY"
            sleep 10
          done
          echo "::error::timed out waiting for '$CHECK'"
          exit 1

      - name: Merge the Dependabot PR
        env:
          PR_URL: ${{github.event.pull_request.html_url}}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Retry around the transient failures GitHub returns under load.
          for attempt in 1 2 3 4 5; do
            if gh pr merge --merge "$PR_URL"; then exit 0; fi
            sleep $((attempt * 5))
          done
          exit 1
