# Merges dependabot PRs -- but only once the checks have actually run green.
#
# This is the constraint that keeps a bad vendorHash off main. nix.yml decides
# whether a go.mod bump is acceptable; nothing here overrides that, so a red
# gate fails this job and no merge happens.
---
name: "Dependabot Automerge - Action"

on:
  pull_request_target:

permissions:
  contents: write
  pull-requests: write

jobs:
  auto-merge:
    name: DependabotMerge
    runs-on: ubuntu-latest
    if: ${{ github.event.pull_request.user.login == 'dependabot[bot]' }}
    steps:
      # Poll the named check until it resolves. Any non-pass outcome -- failure,
      # cancellation, or a check that never ran -- fails the step, which is what
      # stops a stale vendorHash from being merged.
      - name: Wait for the vendorHash gate
        env:
          PR_URL: ${{github.event.pull_request.html_url}}
          CHECK: vendorHash
        run: |
          for attempt in $(seq 1 60); do
            # gh pr checks folds a commit status into the same list as a check
            # run, under the same name and with a populated bucket, so matching on
            # name alone covers both the gate's CheckRun and a heal-published
            # status. `context` is not a field this command accepts.
            # `state` is the status-only fallback, which reports SUCCESS rather
            # than the bucket's pass.
            state=$(gh pr checks "$PR_URL" \
              --json name,bucket,state --jq "
                map(select(.name == \"$CHECK\"))
                | .[0]
                | (.bucket // (if .state == \"SUCCESS\" then \"pass\"
                               elif .state then \"fail\" else \"absent\" end))")
            case "$state" in
              pass)
                echo "check '$CHECK' is green" >> "$GITHUB_STEP_SUMMARY"
                exit 0 ;;
              fail | cancel | skipping)
                echo "::error::required check '$CHECK' is '$state' - refusing to merge"
                exit 1 ;;
            esac
            echo "attempt $attempt on $CHECK: $state" >> "$GITHUB_STEP_SUMMARY"
            sleep 10
          done
          echo "::error::timed out waiting for '$CHECK'"
          exit 1

      - name: Merge the Dependabot PR
        env:
          PR_URL: ${{github.event.pull_request.html_url}}
        run: |
          # Retry around the transient failures GitHub returns under load.
          for attempt in 1 2 3 4 5; do
            if gh pr merge --merge "$PR_URL"; then exit 0; fi
            sleep $((attempt * 5))
          done
          exit 1
